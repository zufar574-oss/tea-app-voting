<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосование за чай</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <main>
    <!-- Экран 1: форма создания голосования -->
    <section id="screen-form" hidden>
      <img class="logo" src="logo.png?v=18" alt="Клуб чайной культуры" width="228" height="72">
      <h1>Создать голосование</h1>

      <label for="option_1">Вариант 1</label>
      <textarea id="option_1" rows="2" placeholder="Напишите первый вариант…"></textarea>

      <label for="option_2">Вариант 2</label>
      <textarea id="option_2" rows="2" placeholder="Напишите второй вариант…"></textarea>

      <label for="option_3">Вариант 3</label>
      <textarea id="option_3" rows="2" placeholder="Напишите третий вариант…"></textarea>

      <button id="create-button" class="btn-primary" type="button">Создать</button>
      <p id="form-message" class="error-message" role="alert"></p>
    </section>

    <!-- Экран 2: QR. Сверху вниз: заголовок, QR, счётчик, строка статуса, «Обновить» и «Скопировать ссылку»,
         отступ, «Подсчитать», мелкие тексты вариантов -->
    <section id="screen-qr" hidden>
      <p class="qr-title">Отсканируйте QR для голосования</p>
      <div id="qr-box" role="img" aria-label="QR-код для голосования"></div>

      <p id="voted-count" class="voted-count" aria-live="polite">Проголосовало: 0</p>
      <p id="qr-message" class="qr-status" role="status"></p>

      <div class="qr-actions">
        <button id="refresh-button" class="btn-secondary" type="button">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="btn-label">Обновить</span>
        </button>
        <button id="copy-button" class="btn-secondary" type="button">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          <span class="btn-label">Скопировать ссылку</span>
        </button>
      </div>

      <!-- «Подсчитать» стоит отдельно от остальных кнопок, с отступом 32px -->
      <button id="count-button" class="btn-primary count-button" type="button">Подсчитать</button>

      <ol id="qr-options" class="qr-variants"></ol>
    </section>

    <!-- Экран 3: итоги. «Новый раунд» появляется, когда числа загружены -->
    <section id="screen-results" hidden>
      <h1>Итоги</h1>
      <div id="results-list"></div>
      <p id="results-message" class="status-text" role="alert"></p>
      <button id="results-refresh-button" class="btn-secondary btn-center" type="button" hidden>
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        <span class="btn-label">Обновить</span>
      </button>
      <button id="new-round-button" class="btn-primary" type="button" hidden>Новый раунд</button>
    </section>

    <!-- Экран 4: страница гостя (адрес с ?poll=<id>) -->
    <section id="screen-guest" hidden>
      <p id="guest-status" class="center-message" role="status"></p>
      <p id="guest-hint" class="vote-hint" hidden>Нажмите на другой вариант, чтобы изменить выбор</p>
      <div id="guest-options"></div>
    </section>
  </main>

  <!-- Номер после ?v= увеличиваем при каждом шаге, чтобы телефон не держал старые файлы -->
  <script src="config.js?v=18"></script>
  <script src="api.js?v=18"></script>
  <script src="qrcode.js?v=18"></script>
  <script src="host.js?v=18"></script>
  <script src="guest.js?v=18"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
