<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосование за чай</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f7f3e8;
      color: #000;
      font-family: system-ui, sans-serif;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Голосование за чай</h1>
  <p id="status">Проверяю связь с базой…</p>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    // Временная проверка шага 5: заменится настоящими экранами в шаге 6.
    const statusLine = document.getElementById('status');

    getPolls()
      .then(function (polls) {
        statusLine.textContent = 'Связь с базой работает. Голосований: ' + polls.length;
      })
      .catch(function () {
        statusLine.textContent = 'Нет связи с базой. Проверьте интернет и обновите страницу.';
      });
  </script>
</body>
</html>
