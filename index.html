<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосование за чай</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <main>
    <!-- Экран 1: форма создания голосования -->
    <section id="screen-form" hidden>
      <h1>Создать голосование</h1>

      <label for="option_1">Вариант 1</label>
      <textarea id="option_1" rows="2"></textarea>

      <label for="option_2">Вариант 2</label>
      <textarea id="option_2" rows="2"></textarea>

      <label for="option_3">Вариант 3</label>
      <textarea id="option_3" rows="2"></textarea>

      <button id="create-button" type="button">Создать</button>
      <p id="form-message" class="message" role="alert"></p>
    </section>

    <!-- Экран 2: QR, счётчик и «Обновить». «Подсчитать» добавим в шаге 11 -->
    <section id="screen-qr" hidden>
      <div id="qr-box" role="img" aria-label="QR-код для голосования"></div>

      <div class="counter-row">
        <p id="voted-count">Проголосовало: 0</p>
        <button id="refresh-button" type="button">Обновить</button>
      </div>
      <p id="qr-message" class="message" role="alert"></p>

      <!-- Здесь в шаге 11 появится кнопка «Подсчитать» (отдельно от «Обновить», с заметным отступом) -->

      <ol id="qr-options" class="small"></ol>
    </section>

    <!-- Экран 4: страница гостя (адрес с ?poll=<id>) -->
    <section id="screen-guest" hidden>
      <p id="guest-status" class="center-message" role="status"></p>
      <div id="guest-options"></div>
    </section>
  </main>

  <!-- Номер после ?v= увеличиваем при каждом шаге, чтобы телефон не держал старые файлы -->
  <script src="config.js?v=10"></script>
  <script src="api.js?v=10"></script>
  <script src="qrcode.js?v=10"></script>
  <script src="host.js?v=10"></script>
  <script src="guest.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
